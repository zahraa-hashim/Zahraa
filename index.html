/* ══════════════════════════════════════════════════════════
   ①  الألوان — مستخرجة من صور زهراء
   ──────────────────────────────────────────────────────────
   أسود الملابس والأجهزة · كريمي ضوء القاعة · ذهبي الغروب من
   الشبابيك · برتقالي الأفق · وردي الكاب · رمادي الدمبلز
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#F7F0E8;          /* كريمي دافي */
  --bg-2:#EFE5DA;        /* كريمي أغمق للأقسام المتناوبة */
  --card:#FBF6F0;
  --ink:#16130F;         /* أسود فحمي */
  --ink-2:#4A4038;
  --soft:#7A6E64;
  --line:rgba(22,19,15,.10);
  --line-2:rgba(22,19,15,.18);
  --gold:#E3A05C;        /* ذهبي الغروب */
  --gold-ink:#9A5A1E;    /* ذهبي مقروء على الكريمي (تباين ≥ 4.5) */
  --ember:#C9713F;       /* برتقالي محمر */
  --blush:#F1C9CF;       /* وردي ناعم */
  --blush-ink:#8E4552;
  --steel:#BDB6AE;
  --night:#16130F;       /* البطاقات الغامقة تبقى غامقة بالوضعين */
  --night-2:#211C17;
  --on-night:#F7F0E8;
  --on-night-soft:rgba(247,240,232,.72);

  --f-head:'Cairo','Noto Sans Arabic',system-ui,sans-serif;
  --f-body:'Noto Sans Arabic','Cairo',system-ui,sans-serif;
  --r-sm:12px; --r:20px; --r-lg:28px; --r-xl:36px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 1px 2px rgba(22,19,15,.05),0 12px 32px -12px rgba(22,19,15,.18);
  --shadow-lg:0 2px 4px rgba(22,19,15,.06),0 30px 60px -20px rgba(22,19,15,.30);
  --wrap:1200px;
  --gut:clamp(16px,4vw,32px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110F0C; --bg-2:#17140F; --card:#1C1814;
    --ink:#F7F0E8; --ink-2:#D9CEC2; --soft:#A89A8C;
    --line:rgba(247,240,232,.10); --line-2:rgba(247,240,232,.18);
    --gold-ink:#F0B877; --blush-ink:#F1C9CF;
    --night:#0B0A08; --night-2:#1A1612;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 30px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110F0C; --bg-2:#17140F; --card:#1C1814;
  --ink:#F7F0E8; --ink-2:#D9CEC2; --soft:#A89A8C;
  --line:rgba(247,240,232,.10); --line-2:rgba(247,240,232,.18);
  --gold-ink:#F0B877; --blush-ink:#F1C9CF;
  --night:#0B0A08; --night-2:#1A1612;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 30px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ══ ②  الأساس ══ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .4s var(--ease),color .4s var(--ease);
}
:lang(en) body{line-height:1.6}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;text-wrap:balance}
.icon{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
:where(a,button,input,select,summary,[tabindex]):focus-visible{outline:2.5px solid var(--gold);outline-offset:3px;border-radius:10px}
.hl{color:var(--gold);position:relative;white-space:nowrap}
.sec-hidden,[hidden]{display:none!important}
::selection{background:var(--gold);color:var(--night)}

/* ══ ③  الأزرار ══ */
.btn{
  --bh:52px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:var(--bh);padding:0 26px;border-radius:999px;
  font-family:var(--f-head);font-weight:800;font-size:15.5px;letter-spacing:0;
  transition:transform .35s var(--spring),background-color .25s var(--ease),color .25s var(--ease),box-shadow .3s var(--ease);
  will-change:transform;white-space:nowrap;
}
.btn:active{transform:scale(.96)!important}
.btn-gold{background:var(--gold);color:var(--night);box-shadow:0 10px 30px -10px rgba(227,160,92,.7)}
.btn-gold:hover{background:#ECB06F}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-line{border:1.5px solid currentColor;opacity:.92}
.btn-line:hover{opacity:1;background:rgba(255,255,255,.06)}
.btn-sm{--bh:42px;padding:0 18px;font-size:14px}
.btn .arr{transition:transform .3s var(--ease)}
.btn:hover .arr{transform:translateX(-4px)}
:root[dir="ltr"] .btn .arr{transform:scaleX(-1)}
:root[dir="ltr"] .btn:hover .arr{transform:scaleX(-1) translateX(-4px)}

/* ══ ④  شريط التقدّم + التنقل ══ */
#progress{
  position:fixed;inset:0 0 auto 0;height:3px;z-index:60;pointer-events:none;
  background:linear-gradient(90deg,var(--ember),var(--gold),var(--blush));
  transform-origin:right;transform:scaleX(0);
}
:root[dir="ltr"] #progress{transform-origin:left}

.nav{
  position:sticky;top:0;z-index:50;
  transition:background-color .35s var(--ease),box-shadow .35s var(--ease),backdrop-filter .35s;
}
.nav.stuck{
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  box-shadow:0 1px 0 var(--line);
}
.nav-in{display:flex;align-items:center;gap:14px;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:900;font-size:18px;letter-spacing:.2px;min-width:0}
.brand-mark{
  width:40px;height:40px;border-radius:13px;flex:none;overflow:hidden;
  display:grid;place-items:center;background:var(--night);color:var(--gold);font-size:19px;
}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:none;gap:4px;margin-inline-start:auto}
.links a{
  position:relative;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2);
  transition:color .2s,background-color .2s;
}
.links a:hover{color:var(--ink);background:var(--line)}
.links a.on{color:var(--ink)}
.links a.on::after{
  content:"";position:absolute;inset-inline:14px;bottom:2px;height:2px;border-radius:2px;background:var(--gold);
  animation:grow .4s var(--ease);
}
.links a.ext{color:var(--gold-ink)}
@keyframes grow{from{transform:scaleX(0)}}
.nav-tools{display:flex;align-items:center;gap:6px;margin-inline-start:auto}
.links + .nav-tools{margin-inline-start:8px}
.ibtn{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink-2);transition:background-color .2s,color .2s,transform .3s var(--spring);
}
.ibtn:hover{background:var(--line);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.lang-txt{font-family:var(--f-head);font-weight:800;font-size:14px}
.theme-ico [data-when="dark"]{display:none}
:root[data-theme="dark"] .theme-ico [data-when="light"]{display:none}
:root[data-theme="dark"] .theme-ico [data-when="dark"]{display:block}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-ico [data-when="light"]{display:none}
  :root:not([data-theme="light"]) .theme-ico [data-when="dark"]{display:block}
}
.nav-cta{display:none}
#menuBtn{display:grid}
@media (min-width:960px){
  .links{display:flex}
  .nav-tools{margin-inline-start:0}
  .nav-cta{display:inline-flex}
  #menuBtn{display:none}
}
/* قائمة الموبايل */
.menu{
  position:fixed;inset:72px 12px auto 12px;z-index:49;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  padding:10px;display:grid;gap:2px;
  transform-origin:top center;transform:translateY(-8px) scale(.97);opacity:0;visibility:hidden;
  transition:opacity .25s var(--ease),transform .35s var(--spring),visibility 0s .35s;
}
.menu.open{opacity:1;transform:none;visibility:visible;transition:opacity .25s var(--ease),transform .35s var(--spring)}
.menu a{padding:14px 16px;border-radius:14px;font-weight:700;font-size:17px}
.menu a:hover{background:var(--line)}
.menu .btn{margin-top:6px}

/* ══ ⑤  شاشة الإقلاع — تختفي أول ما توصل البيانات (٢٫٥ ث حد أقصى) ══ */
#boot{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);
  transition:opacity .6s var(--ease),visibility 0s .6s;
}
#boot.gone{opacity:0;visibility:hidden}
#boot b{
  width:72px;height:72px;border-radius:22px;display:grid;place-items:center;
  background:var(--night);color:var(--gold);font-family:var(--f-head);font-size:34px;font-weight:900;
  animation:breathe 1.4s var(--ease) infinite;
}
@keyframes breathe{50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(227,160,92,.12)}}

/* ══ ⑥  رؤوس الأقسام ══ */
.sec{padding-block:clamp(72px,10vw,128px)}
.sec-alt{background:var(--bg-2)}
.head{display:grid;gap:10px;justify-items:center;text-align:center;margin-bottom:clamp(36px,5vw,56px)}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--f-head);font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--gold-ink);
}
:lang(en) .kicker{text-transform:uppercase;letter-spacing:1.6px;font-size:12px}
.kicker::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.head h2{font-size:clamp(30px,5.4vw,54px);font-weight:900;letter-spacing:-.3px}
:lang(en) .head h2{text-transform:uppercase;letter-spacing:-.5px}
.head p{color:var(--soft);font-size:clamp(15px,1.6vw,17px);max-width:560px}

/* ══ ⑦  حركة الظهور مع التمرير ══ */
[data-rv]{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
[data-rv="left"]{transform:translateX(-40px)}
[data-rv="right"]{transform:translateX(40px)}
[data-rv="zoom"]{transform:scale(.92)}
[data-rv].in{opacity:1;transform:none}

/* ══ ⑧  بطاقة البداية ══ */
.intro{padding-block:8px clamp(40px,6vw,72px)}
.intro-card{
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;grid-template-columns:1fr;border-radius:var(--r-xl);
  background:var(--night);color:var(--on-night);box-shadow:var(--shadow-lg);
}
/* توهج الغروب — يلحق المؤشر بالشاشات اللي بيها ماوس */
.intro-card::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(600px circle at var(--mx,20%) var(--my,30%),rgba(227,160,92,.22),transparent 60%),
    radial-gradient(500px circle at 90% 110%,rgba(201,113,63,.28),transparent 60%),
    radial-gradient(400px circle at 0% 0%,rgba(241,201,207,.10),transparent 60%);
  transition:background .2s;
}
.intro-text{padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:22px;order:2}
.intro .kicker{color:var(--gold)}
.intro h1{
  font-size:clamp(40px,7.4vw,84px);font-weight:900;line-height:1.08;letter-spacing:-.5px;
}
:lang(en) .intro h1{text-transform:uppercase;line-height:.98;letter-spacing:-1.5px}
/* الكلمات تطلع وحدة وحدة */
.intro h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.intro h1 .w > span{display:inline-block;transform:translateY(105%);transition:transform 1s var(--ease);transition-delay:calc(var(--i) * 70ms + .15s)}
.intro.go h1 .w > span{transform:none}
.intro-sub{color:var(--on-night-soft);font-size:clamp(15.5px,1.7vw,18px);max-width:470px}
.intro-acts{display:flex;flex-wrap:wrap;gap:12px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;padding-top:22px;
  border-top:1px solid rgba(247,240,232,.16);max-width:460px;
}
.stat b{display:block;font-family:var(--f-head);font-weight:900;font-size:clamp(22px,3vw,30px);line-height:1.1;color:var(--on-night);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--on-night-soft)}
/* الأرقام تنعرض مثل ما انكتبت (+120 تبقى +120 مو 120+) */
.stat b,.burst b,.price b{direction:ltr;unicode-bidi:isolate}
/* الرقم LTR، فـ text-align:start يصير يسار ويبعد عن الكلمة.
   عرضه على قد الرقم، فيلزق بنفس حافة الكلمة تحته (يمين بالعربي، يسار بالإنكليزي) */
.stat b{width:fit-content;max-width:100%}

.intro-art{position:relative;min-height:clamp(380px,62vw,520px);order:1;overflow:hidden}
.intro-photo{position:absolute;inset:-8% 0;will-change:transform}
.intro-photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
/* سلايد صور البداية: تتبدل بتلاشي ناعم وتكبير بطيء */
.intro-photo .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.4s var(--ease)}
.intro-photo .sl.on{opacity:1}
.intro-photo .sl img{transform:scale(1.04);transition:transform 6.5s linear}
.intro-photo .sl.on img{transform:scale(1.13)}
.sl-bars{position:absolute;z-index:3;inset-block-end:14px;inset-inline-start:22px;display:flex;gap:6px}
.sl-bars button{position:relative;width:28px;height:4px;border-radius:4px;background:rgba(247,240,232,.3);overflow:hidden}
.sl-bars button::before{content:"";position:absolute;inset:-14px -4px}
.sl-bars button i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--gold)}
:root[dir="rtl"] .sl-bars button i{transform-origin:right}
.sl-bars button.on i{animation:slfill 5s linear forwards}
.sl-bars button.done i{transform:none}
@keyframes slfill{to{transform:none}}
.intro-photo::after{ /* دمج الصورة بالبطاقة */
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,var(--night) 0%,transparent 40%);
}
.ph-empty{
  width:100%;height:100%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(227,160,92,.35),transparent 60%),var(--night-2);
  font-family:var(--f-head);font-weight:900;font-size:min(40vw,240px);color:rgba(227,160,92,.25);
}
/* النجمة الدوّارة */
.burst{
  position:absolute;inset-block-start:22px;inset-inline-start:22px;z-index:2;
  width:clamp(108px,14vw,138px);aspect-ratio:1;display:grid;place-items:center;text-align:center;
  color:var(--night);
}
.burst svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--gold);animation:spin 22s linear infinite}
.burst b{position:relative;display:block;font-family:var(--f-head);font-size:clamp(24px,3vw,30px);font-weight:900;line-height:1}
.burst > span{position:relative;max-width:72%;line-height:1.15}
.burst span span{position:relative;display:block;font-size:11.5px;font-weight:700;margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
/* البطاقة الزجاجية العائمة */
.float{
  position:absolute;inset-inline-end:18px;inset-block-end:22px;z-index:2;
  display:flex;align-items:center;gap:12px;padding:12px 16px 12px 14px;border-radius:18px;
  background:rgba(247,240,232,.14);border:1px solid rgba(247,240,232,.22);color:var(--on-night);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  animation:bob 5s ease-in-out infinite;
}
.float i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:var(--night);font-style:normal}
.float b{display:block;font-family:var(--f-head);font-size:15px;line-height:1.2}
.float small{font-size:12.5px;color:var(--on-night-soft)}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (min-width:900px){
  .intro-card{grid-template-columns:1.08fr .92fr;min-height:min(640px,calc(100svh - 100px))}
  .intro-text{order:1}
  .intro-art{order:2;min-height:0}
  .intro-photo::after{background:linear-gradient(to left,transparent 70%,var(--night) 100%)}
  :root[dir="ltr"] .intro-photo::after{background:linear-gradient(to right,transparent 70%,var(--night) 100%)}
}

/* ══ ⑨  الشريط المتحرك ══ */
/* الغلاف يقص الأطراف المايلة — بدونه الشريط المايل يطلّع تمرير أفقي */
.mq-wrap{overflow:hidden;padding-block:12px;margin-block:-12px;position:relative;z-index:3}
.marquee{
  background:var(--gold);color:var(--night);overflow:hidden;
  transform:rotate(-1.2deg) scaleX(1.04);
  box-shadow:0 10px 30px -14px rgba(201,113,63,.6);
}
.mq-track{display:flex;width:max-content;animation:mq 38s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-track span{
  display:inline-flex;align-items:center;gap:22px;padding:15px 11px;
  font-family:var(--f-head);font-weight:800;font-size:clamp(15px,2vw,19px);white-space:nowrap;
}
.mq-track span::after{content:"✦";font-size:.8em;opacity:.7}
@keyframes mq{to{transform:translateX(50%)}}
:root[dir="ltr"] .mq-track{animation-name:mq-ltr}
@keyframes mq-ltr{to{transform:translateX(-50%)}}

/* ══ ⑩  الخدمات ══ */
.svc-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){ .svc-grid{grid-template-columns:repeat(3,1fr)} }
.svc{
  position:relative;overflow:hidden;padding:30px 26px 28px;border-radius:var(--r-lg);
  background:var(--card);border:1px solid var(--line);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s;
}
.svc:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:transparent}
.svc::after{ /* توهج يطلع من الزاوية عند المرور */
  content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(227,160,92,.28),transparent 70%);
  opacity:0;transition:opacity .5s var(--ease);
}
.svc:hover::after{opacity:1}
.svc-n{position:absolute;inset-block-start:22px;inset-inline-end:24px;font-family:var(--f-head);font-weight:900;font-size:44px;line-height:1;color:var(--line-2)}
.svc-ico{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin-bottom:22px;
  background:var(--night);color:var(--gold);font-size:24px;
  transition:transform .6s var(--spring);
}
.svc:hover .svc-ico{transform:rotate(-12deg) scale(1.08)}
.svc h3{font-size:20px;font-weight:800;margin-bottom:8px}
:lang(en) .svc h3{text-transform:uppercase;font-size:17px;letter-spacing:.3px}
.svc p{color:var(--soft);font-size:15px}

/* ══ ⑪  تعرّفي عليّ ══ */
.about-card{
  display:grid;grid-template-columns:1fr;border-radius:var(--r-xl);overflow:hidden;
  background:var(--card);border:1px solid var(--line);
}
.about-photo{position:relative;min-height:380px;overflow:hidden}
.about-photo .pimg{position:absolute;inset:-10% 0;will-change:transform}
.about-photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.script{
  position:absolute;inset-block-start:26px;inset-inline-start:24px;z-index:1;
  font-family:var(--f-head);font-weight:300;font-size:clamp(24px,3vw,34px);line-height:1.25;
  color:#fff;white-space:pre-line;text-shadow:0 2px 20px rgba(0,0,0,.45);transform:rotate(-6deg);
}
.about-body{padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.about-body p{color:var(--ink-2);white-space:pre-line}
.sign{
  font-family:var(--f-head);font-weight:300;font-size:clamp(30px,3.6vw,40px);color:var(--gold-ink);
  margin-top:6px;position:relative;align-self:flex-start;
}
.sign svg{position:absolute;inset-inline:0;bottom:-10px;width:100%;height:16px;overflow:visible}
.sign path{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;transition:stroke-dashoffset 1.6s var(--ease) .4s}
.in .sign path,.sign.in path{stroke-dashoffset:0}
.about-quote{
  padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px;
  background:var(--blush);color:#3A1E24;
}
.about-quote .qm{font-family:var(--f-head);font-size:72px;line-height:.6;font-weight:900;color:var(--blush-ink)}
:root[data-theme="dark"] .about-quote .qm{color:#8E4552}
.about-quote blockquote{margin:0;font-family:var(--f-head);font-weight:500;font-size:clamp(21px,2.4vw,27px);line-height:1.45}
.about-quote cite{font-style:normal;font-size:13.5px;font-weight:700;opacity:.8}
@media (min-width:900px){
  .about-card{grid-template-columns:1fr 1.15fr .85fr}
  .about-photo{min-height:520px}
}

/* ══ ⑫  الآراء ══ */
.rev{position:relative;max-width:880px;margin-inline:auto;text-align:center}
.rev-stage{display:grid}
.rev-item{
  grid-area:1/1;display:grid;gap:22px;justify-items:center;
  opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;
  transition:opacity .7s var(--ease),transform .7s var(--ease);
}
.rev-item.on{opacity:1;transform:none;pointer-events:auto}
.stars{display:flex;gap:4px;color:var(--gold)}
.stars .icon{fill:currentColor;stroke:none;width:20px;height:20px}
.rev-item blockquote{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(22px,3.6vw,38px);line-height:1.45;text-wrap:balance}
.who{display:flex;align-items:center;gap:12px;text-align:start}
.who i{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  background:var(--night);color:var(--gold);font-family:var(--f-head);font-weight:900;font-size:18px;
}
.who b{display:block;font-family:var(--f-head);font-size:15.5px;line-height:1.3}
.who small{color:var(--soft);font-size:13px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:34px}
.dots button{width:9px;height:9px;border-radius:9px;background:var(--line-2);transition:width .4s var(--ease),background-color .3s}
.dots button[aria-current="true"]{width:30px;background:var(--gold)}
.dots button::before{content:"";display:block;width:44px;height:44px;margin:-17px} /* مساحة لمس أكبر */

/* ══ ⑬  الباقات والكلاسات — شريط بطاقات دوّار (coverflow)
   البطاقة بالنص كبيرة وقدّام، والجيران مايلين لورا. البطاقة الفعّالة
   تنقلب (مثل الكارت) لما يمر عليها المؤشر أو تنضغط «التفاصيل»:
   الوجه = الاسم والسعر، والظهر = كل المزايا وزر الاشتراك. ══ */
#plans,#classes{overflow-x:clip}
.sec-night{background:var(--night);color:var(--on-night)}
.sec-night .kicker{color:var(--gold)}
.sec-night .head p{color:var(--on-night-soft)}

.cf{--w:min(360px,80vw);--h:580px;position:relative}
.cf-stage{position:relative;height:var(--h);perspective:1500px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.cf-card{
  position:absolute;top:0;left:50%;width:var(--w);height:100%;margin-left:calc(var(--w) / -2);
  transform-style:preserve-3d;will-change:transform;
  transition:transform .75s var(--ease),opacity .5s var(--ease);
}
.cf-card:not(.on){cursor:pointer}
.cf-card.far{opacity:0;pointer-events:none}
.cf-card .flip{
  position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.3,1.3,.5,1);
}
.cf-card.flipped .flip{transform:rotateY(180deg)}
.cf-card:not(.on) .face{filter:saturate(.8) brightness(.94)}
.sec-night .cf-card:not(.on) .face{filter:brightness(.62)}

.face{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  padding:30px 26px 26px;border-radius:var(--r-lg);overflow:hidden;
  background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;transition:filter .5s var(--ease);
}
.face.back{transform:rotateY(180deg)}
.feat .face{background:var(--night);color:var(--on-night);border-color:transparent}
.feat .face::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px circle at 100% 0%,rgba(227,160,92,.32),transparent 60%);
}
.sec-night .feat .face{background:linear-gradient(165deg,#2C2117,#16120E 70%);border:1px solid rgba(227,160,92,.5)}
.face > *{position:relative}
.badge{
  position:absolute;inset-block-start:18px;inset-inline-end:18px;z-index:1;
  padding:5px 13px;border-radius:999px;background:var(--blush);color:#3A1E24;
  font-family:var(--f-head);font-size:12.5px;font-weight:800;
}
.face h3{font-size:clamp(21px,2.2vw,24px);font-weight:900;line-height:1.25}
.face .tag{display:block;margin-top:4px;font-size:13.5px;color:var(--soft)}
.feat .face .tag,.feat .face .desc,.feat .face li,.feat .face .peek li{color:var(--on-night-soft)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-family:var(--f-head);font-size:clamp(38px,4.4vw,46px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.feat .price b{color:var(--gold)}
.price span{font-size:14px;color:var(--soft)}
.feat .price span{color:var(--on-night-soft)}
.desc{font-size:14.5px;color:var(--soft);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.face ul{list-style:none;margin:0;padding:0;display:grid;gap:11px;align-content:start}
.face li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2)}
.face li .icon{color:var(--gold);margin-top:.3em;flex:none}
.peek{padding-top:14px!important;border-top:1px solid var(--line)}
.feat .peek{border-color:rgba(247,240,232,.14)}
.peek li span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.peek .more{font-size:13px;font-weight:700;color:var(--gold-ink)}
.feat .peek .more{color:var(--gold)}
.face .grow{flex:1;min-height:0}
.face-acts{display:flex;gap:10px;align-items:center}
.face-acts .btn{flex:1}
.flip-btn{
  flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--bh,52px);padding:0 16px;border-radius:999px;
  font-family:var(--f-head);font-weight:800;font-size:14px;border:1.5px solid var(--line-2);color:inherit;
  transition:background-color .2s,border-color .2s,transform .3s var(--spring);
}
.flip-btn:hover{border-color:var(--gold);background:rgba(227,160,92,.12)}
.flip-btn:active{transform:scale(.95)}
.feat .flip-btn{border-color:rgba(247,240,232,.28)}
.flip-btn .icon{width:18px;height:18px}
/* الظهر */
.back-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.feat .back-head{border-color:rgba(247,240,232,.14)}
.back-head b{flex:1;font-family:var(--f-head);font-size:18px;font-weight:900;line-height:1.3}
.back-head .ibtn{flex:none;color:inherit;background:var(--line)}
.feat .back-head .ibtn{background:rgba(247,240,232,.1)}
.back-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-inline-end:4px;scrollbar-width:thin}
.back-list .desc{-webkit-line-clamp:unset;display:block;margin-bottom:14px;white-space:pre-line}
/* الباقات: الوعد فوك، السعر تحت */
#planCf{--h:640px}
.promise{font-family:var(--f-head);font-size:16.5px;font-weight:800;line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.feat .promise{color:var(--on-night)}
#planCf .peek{gap:9px}
.fit{font-size:13.5px;line-height:1.6;color:var(--soft);padding:9px 12px;border-radius:12px;background:rgba(227,160,92,.1);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.fit b{color:var(--gold-ink);font-weight:800}
.feat .fit{color:var(--on-night-soft);background:rgba(227,160,92,.14)}
.feat .fit b{color:var(--gold)}
.pbox{display:grid;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
.feat .pbox{border-color:rgba(247,240,232,.14)}
.pbox .price b{font-size:clamp(32px,3.6vw,38px)}
.pbox.sum{padding-top:12px}
.pbox.sum .price b{font-size:26px}
.was{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.was s{color:var(--soft);direction:ltr;unicode-bidi:isolate;text-decoration-thickness:1.5px}
.feat .was s{color:var(--on-night-soft)}
.save{padding:2px 10px;border-radius:999px;background:var(--blush);color:#3A1E24;font-family:var(--f-head);font-size:12px;font-weight:800}
.pnote{font-size:13px;color:var(--soft)}
.feat .pnote{color:var(--on-night-soft)}
.assure{display:flex;gap:7px;align-items:flex-start;margin-top:-4px;font-size:12.5px;line-height:1.5;color:var(--soft)}
.assure .icon{flex:none;width:15px;height:15px;margin-top:.15em;color:var(--gold-ink)}
.feat .assure{color:var(--on-night-soft)}
.feat .assure .icon{color:var(--gold)}
.p-review{display:flex;gap:9px;margin:16px 0 0;padding:12px 14px;border-radius:14px;background:rgba(241,201,207,.35);font-size:14px;line-height:1.6}
.p-review .icon{flex:none;color:var(--gold);margin-top:.25em}
.feat .p-review{background:rgba(241,201,207,.1)}
.back-sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--f-head)}
.back-sum b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.feat .back-sum b{color:var(--gold)}
.back-sum span{font-size:13px;color:var(--soft)}
.feat .back-sum span{color:var(--on-night-soft)}
/* بطاقة الكلاس: صورة فوق */
.face.cls{padding:0;gap:0}
.cls-img{position:relative;height:190px;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--gold),#C9713F)}
.cls-img img{width:100%;height:100%;object-fit:cover}
.cls-img .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(22,19,15,.55)}
.cls-img .ph .icon{width:64px;height:64px;stroke-width:1.4}
.cls-img::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,.35))}
.cls-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:20px 24px 24px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:var(--line);color:var(--ink-2);
}
.feat .meta span{background:rgba(247,240,232,.1);color:var(--on-night)}
.meta .icon{width:14px;height:14px;color:var(--gold-ink)}
.feat .meta .icon{color:var(--gold)}
.cls .price b{font-size:clamp(30px,3.4vw,36px)}
/* التنقل تحت الشريط */
.cf-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:30px}
.cf-arrow{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line-2);color:var(--ink);box-shadow:0 6px 20px -8px rgba(22,19,15,.25);
  transition:transform .3s var(--spring),background-color .2s,color .2s;
}
.cf-arrow:hover{background:var(--gold);color:var(--night);border-color:transparent}
.cf-arrow:active{transform:scale(.9)}
.cf-arrow.next .icon{transform:scaleX(1)}
.cf-arrow.prev .icon{transform:scaleX(-1)}
:root[dir="ltr"] .cf-arrow.next .icon{transform:scaleX(-1)}
:root[dir="ltr"] .cf-arrow.prev .icon{transform:scaleX(1)}
.sec-night .cf-arrow{background:rgba(247,240,232,.08);border-color:rgba(247,240,232,.18);color:var(--on-night)}
.sec-night .cf-arrow:hover{background:var(--gold);color:var(--night)}
.cf-dots{margin-top:0}
.sec-night .cf-dots button{background:rgba(247,240,232,.25)}
.sec-night .cf-dots button[aria-current="true"]{background:var(--gold)}
@media (max-width:560px){ .cf{--h:560px} .face{padding:26px 22px 22px} }
.pay-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:30px;color:var(--soft);font-size:14px;text-align:center}

/* ══ ⑭  الأسئلة ══ */
.faq-card{display:grid;grid-template-columns:1fr;border-radius:var(--r-xl);overflow:hidden;background:var(--card);border:1px solid var(--line)}
.faq-photo{position:relative;min-height:300px;overflow:hidden}
.faq-photo .pimg{position:absolute;inset:-10% 0;will-change:transform}
.faq-photo img{width:100%;height:100%;object-fit:cover}
.faq-list{padding:clamp(18px,3.5vw,44px)}
.qa{border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.qa button{
  width:100%;display:flex;align-items:center;gap:16px;justify-content:space-between;text-align:start;
  padding:22px 4px;font-family:var(--f-head);font-weight:800;font-size:clamp(16px,1.8vw,18px);
}
.qa .pm{
  width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--line);transition:transform .45s var(--spring),background-color .3s,color .3s;
}
.qa[data-open] .pm{transform:rotate(45deg);background:var(--gold);color:var(--night)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.qa[data-open] .ans{grid-template-rows:1fr}
.qa .ans > div{overflow:hidden}
.qa .ans p{padding:0 4px 22px;color:var(--soft);white-space:pre-line}
@media (min-width:900px){
  .faq-card{grid-template-columns:.9fr 1.1fr}
  .faq-photo{min-height:560px}
}

/* ══ ⑮  التواصل + الفوتر ══ */
.contact{padding-block:0 clamp(48px,7vw,88px)}
.cta-card{
  position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r-xl);
  background:var(--night);color:var(--on-night);text-align:center;
  padding:clamp(56px,9vw,110px) var(--gut);display:grid;gap:18px;justify-items:center;
}
.cta-card::before,.cta-card::after{
  content:"";position:absolute;z-index:-1;width:60%;aspect-ratio:1;border-radius:50%;filter:blur(40px);
  animation:drift 14s ease-in-out infinite alternate;
}
.cta-card::before{background:rgba(227,160,92,.30);inset:-30% auto auto -15%}
.cta-card::after{background:rgba(201,113,63,.25);inset:auto -15% -40% auto;animation-delay:-7s}
@keyframes drift{to{transform:translate(12%,10%) scale(1.15)}}
.cta-card .kicker{color:var(--gold)}
.cta-card h2{font-size:clamp(34px,6.4vw,72px);font-weight:900}
:lang(en) .cta-card h2{text-transform:uppercase}
.cta-card p{color:var(--on-night-soft);max-width:520px;font-size:clamp(15.5px,1.7vw,18px)}
.cta-acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}

.foot{background:var(--night);color:var(--on-night-soft);padding-block:44px 28px;font-size:14px}
.foot-in{display:grid;gap:22px}
.foot .brand{color:var(--on-night)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot-links a:hover{color:var(--gold)}
.foot-bot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding-top:20px;border-top:1px solid rgba(247,240,232,.12);font-size:13px}
.foot-bot a{opacity:.7}
.foot-bot a:hover{opacity:1;color:var(--gold)}
@media (min-width:760px){ .foot-in{grid-template-columns:1fr auto;align-items:center} }

/* ══ ⑯  نافذة الدفع ══ */
dialog{
  border:0;padding:0;margin:auto;width:min(480px,calc(100% - 24px));max-height:calc(100svh - 24px);
  border-radius:var(--r-lg);background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg);overflow:auto;
}
dialog::backdrop{background:rgba(11,10,8,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog[open]{animation:pop .45s var(--spring)}
dialog[open]::backdrop{animation:fade .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes fade{from{opacity:0}}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:24px 24px 6px}
.dlg-head h2{font-size:22px;font-weight:900;flex:1}
.dlg-body{padding:6px 24px 24px;display:grid;gap:16px}
.dlg-body > p{color:var(--soft);font-size:14.5px}
.pick{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;
  background:var(--night);color:var(--on-night);
}
.pick small{display:block;font-size:12px;color:var(--on-night-soft)}
.pick b{font-family:var(--f-head);font-size:17px}
.pick .amt{font-family:var(--f-head);font-weight:900;color:var(--gold);white-space:nowrap}
.fld{display:grid;gap:6px}
.fld label{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.fld input,.fld select{
  width:100%;min-height:50px;padding:0 16px;border-radius:14px;
  border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;
  transition:border-color .2s,box-shadow .2s;
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,160,92,.2)}
.fld input[dir="ltr"]{text-align:start}
.err{color:#C0392B;font-size:13.5px;font-weight:600;min-height:1em}
:root[data-theme="dark"] .err{color:#FF8A7A}
.secure{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--soft)}
.secure .icon{margin-top:.25em;color:var(--gold-ink)}
.res{text-align:center;justify-items:center}
.res .big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--gold);color:var(--night);animation:pop .6s var(--spring)}
.res.bad .big{background:var(--blush);color:#3A1E24}

/* ══ استمارة التقييم ══ */
.form-dlg{width:min(600px,calc(100% - 20px))}
.fp-plan{font-size:13.5px;color:var(--gold-ink);font-weight:700;margin-top:2px}
.fp-bar{height:4px;margin:10px 24px 0;border-radius:4px;background:var(--line);overflow:hidden}
.fp-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:inherit;transition:width .5s var(--ease)}
.fp-step{font-family:var(--f-head);font-weight:900;font-size:18px;margin-top:4px}
#formSteps .fld{margin-bottom:16px}
#formSteps .lbl{font-size:14px;font-weight:700;color:var(--ink-2);line-height:1.5}
#formSteps .req{color:#C0392B}
.fld textarea{
  width:100%;min-height:84px;padding:12px 16px;border-radius:14px;resize:vertical;
  border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;
}
.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,160,92,.2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){ .f2{grid-template-columns:1fr} }
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.col{display:grid}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{
  display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 14px;border-radius:14px;cursor:pointer;
  border:1.5px solid var(--line-2);background:var(--bg);font-size:15px;line-height:1.4;
  transition:border-color .2s,background-color .2s;
}
.opt span::before{
  content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);
  transition:border-color .2s,background-color .2s,box-shadow .2s;
}
.opt input[type=checkbox] + span::before{border-radius:6px}
.opt input:checked + span{border-color:var(--gold);background:rgba(227,160,92,.12)}
.opt input:checked + span::before{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--bg)}
.opt input:focus-visible + span{box-shadow:0 0 0 4px rgba(227,160,92,.25)}
.opts.yn .opt{flex:1;min-width:110px}
.sub-q{margin-top:8px}
.fp-note{font-size:12.5px;color:var(--soft);margin-top:6px}
.fp-acts{display:flex;gap:10px}
.fp-acts .btn{flex:1}
.fp-acts #formPrev[hidden] + .btn{flex:1}
#formDone .btn{margin-top:4px}

/* ══ فيديوهات الكلاسات ══ */
.vids-h{display:flex;align-items:center;gap:10px;margin:44px 0 16px;font-family:var(--f-head);font-weight:900;font-size:20px}
.vids-h .icon{color:var(--gold)}
.vids{
  display:grid;grid-auto-flow:column;grid-auto-columns:clamp(150px,22vw,210px);gap:14px;
  overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin;
}
.vid{
  position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;scroll-snap-align:start;
  background:var(--night-2);border:1px solid rgba(247,240,232,.12);cursor:pointer;
  transition:transform .4s var(--spring);
}
.vid:hover{transform:translateY(-4px)}
.vid video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.vid::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.vid .play{
  position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;z-index:1;
  display:grid;place-items:center;background:rgba(227,160,92,.92);color:var(--night);
}
.vid .play .icon{width:22px;height:22px;margin-inline-start:3px}
:root[dir="rtl"] .vid .play .icon{margin-inline-start:0;margin-inline-end:3px}
.vid b{position:absolute;inset:auto 12px 12px;z-index:1;color:#fff;font-family:var(--f-head);font-size:14px;line-height:1.3}
.cls-play{
  position:absolute;inset-block-end:12px;inset-inline-start:12px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:rgba(22,19,15,.72);color:#fff;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px);
}
.cls-play .icon{width:14px;height:14px;color:var(--gold)}
/* ⚠️ لازم fixed: لو relative، الموبايل يثبّت النافذة بأعلى الصفحة مو بالشاشة */
.vid-dlg{position:fixed;inset:0;margin:auto;width:min(440px,calc(100% - 20px));height:fit-content;max-height:calc(100svh - 20px);background:#000;padding:0;overflow:hidden}
html:has(.vid-dlg[open]){overflow:hidden}   /* الصفحة ما تتحرك ورا الفيديو */
.vid-dlg video{display:block;width:100%;max-height:calc(100svh - 90px);background:#000}
.vid-dlg .ibtn{position:absolute;top:10px;inset-inline-end:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff}
.vid-dlg p{color:#fff;padding:12px 16px;font-family:var(--f-head);font-weight:800}

/* ══ ⑰  تقليل الحركة — كل الحركات تنطفي، والمحتوى يبين فوراً ══ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  html{scroll-behavior:auto}
  [data-rv]{opacity:1;transform:none}
  .intro h1 .w > span{transform:none}
  .burst svg,.float,.mq-track{animation:none!important}
}
</style>

<script>

   ───────────────────────────────────────────────────────────
   • كل نص بالصفحة يجي من site_info.landing (تبويب «نصوص الصفحة»
     باللوحة)، والناقص يطلع من landing-defaults.js
   • القوائم (الأرقام · الخدمات · الباقات · الآراء · الأسئلة) من
     أعمدتها القديمة بـ site_info — نفس محرراتها باللوحة
   • صفحتا الأكل والتمارين (catalog.html) مخفيات إلا إذا انشغلن
     صراحةً من اللوحة: sections.food / sections.courses === true
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://kjpwcvhsjfuwzketkjkk.supabase.co";
const SUPABASE_KEY = "sb_publishable_7Sq6BeRa9KQPR1zy1VFHFg_WOhUoUt0";
/* اسم دالة الدفع على Supabase — شوف supabase/functions/wayl-checkout */
const PAY_FN = 'wayl-checkout';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* أي رابط من الداتابيس يمر من هنا قبل ما ينحط بـ href — يمنع javascript: */
const safeUrl = u => /^https?:\/\//i.test(String(u ?? '').trim()) ? String(u).trim() : '#';
const ico = (id, cls) => `<svg class="icon${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#${id}"></use></svg>`;
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const FINE = matchMedia('(hover:hover) and (pointer:fine)');

let LANG = document.documentElement.lang === 'en' ? 'en' : 'ar';
let SITE = {};

/* ── الأرقام الهندية تتحول لإنكليزية عند العرض (نفس سياسة catalog.html) ── */
const AR_NUM = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
                '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٬':',','٫':'.'};
const latin = s => String(s ?? '').replace(/[٠-٩۰-۹٬٫]/g, c => AR_NUM[c]);

/* حقل ثنائي اللغة {ar,en} — الإنكليزي الفاضي يرجع للعربي */
const bi = v => {
  if (v == null) return '';
  if (typeof v === 'string') return latin(v);
  return latin(v[LANG] || v.ar || v.en || '');
};
const biArr = v => {
  if (!v) return [];
  if (Array.isArray(v)) return v.map(latin);
  const a = (v[LANG] && v[LANG].length) ? v[LANG] : (v.ar || v.en || []);
  return Array.isArray(a) ? a.map(latin) : [];
};

/* نص من نصوص الصفحة: L('intro.title')
   ⚠️ القيمة الفاضية باللوحة تعني «فاضي» مو «افتراضي» — حتى الكوتش
   تكدر تشيل سطر. الافتراضي يطلع بس إذا المفتاح نفسه ما موجود. */
function Lraw(path){
  const [g, k] = path.split('.');
  const saved = SITE.landing && SITE.landing[g] && SITE.landing[g][k];
  /* نص محفوظ يطابق نص قديم موجّه للبنات بس ← النص العام الجديد */
  const legacy = saved && window.LANDING_IS_LEGACY && LANDING_IS_LEGACY(g, k, saved.ar);
  if (!legacy && saved && typeof saved === 'object' && ('ar' in saved || 'en' in saved)){
    const v = saved[LANG];
    if (Array.isArray(v) ? v.length : String(v ?? '').trim()) return saved;
    /* الإنكليزي فاضي → العربي */
    return { ar:saved.ar, en:saved.ar };
  }
  return (LANDING_DEFAULTS[g] || {})[k];
}
const L = path => {
  const v = Lraw(path);
  return Array.isArray(v && v.ar) ? biArr(v) : bi(v);
};

/* العناوين: الكلمة بين نجمتين *كلمة* تتلوّن بالذهبي.
   ⚠️ النص ينهرب كامل أول، وبعدين النجمتين تتحول لوسم واحد ثابت —
   فماكو أي HTML من الداتابيس يوصل للصفحة. الصيغة القديمة
   <span class="hl"> هم مقبولة (نفس heroHtml بـ catalog.html). */
function titleHtml(raw){
  const escaped = String(raw ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return escaped
    .replace(/\*([^*\n]+)\*/g, '<span class="hl">$1</span>')
    .replace(/&lt;span class=(?:&quot;|"|')?hl(?:&quot;|"|')?&gt;/gi, '<span class="hl">')
    .replace(/&lt;\/span&gt;/gi, '</span>');
}

/* قائمة من site_info — والاحتياطية إذا فاضية تماماً */
const list = key => (Array.isArray(SITE[key]) && SITE[key].length) ? SITE[key] : (LANDING_LISTS[key] || []);
/* الكلاسات محفوظة بـ site_info.landing.classes (ما تحتاج عمود جديد).
   ماكو قائمة احتياطية: إذا ماكو كلاسات، القسم وزرّه ورابطه يختفون. */
const classList = () => (SITE.landing && Array.isArray(SITE.landing.classes) ? SITE.landing.classes : []).filter(c => bi(c.name));
const hasClasses = () => sec('classes') && classList().length > 0;
/* روابط فيديو الكلاس — بس روابط https (من باكت videos) */
const classVideos = c => (Array.isArray(c && c.videos) ? c.videos : []).filter(u => /^https:\/\//i.test(String(u || '')));

const siteName = () => (LANG === 'en' && SITE.name_en) ? SITE.name_en : (SITE.name || (LANG === 'en' ? 'Coach Zahraa' : 'كوتش زهراء'));
const siteBio  = () => latin((LANG === 'en' && SITE.bio_en) ? SITE.bio_en : (SITE.bio || ''));
const sec  = k => !(SITE.sections && SITE.sections[k] === false);   /* الناقص = ظاهر */
const page = k => !!(SITE.sections && SITE.sections[k] === true);   /* الناقص = مخفي */
const photos = () => {
  const h = Array.isArray(SITE.hero_images) ? SITE.hero_images.filter(Boolean) : [];
  if (!h.length && SITE.hero_image) h.push(SITE.hero_image);
  return h;
};

/* ══════════════════════════════════════════════════════════
   الرسم
   ══════════════════════════════════════════════════════════ */
const SECTION_NODES = {
  /* المفتاح ← العناصر اللي تختفي وياه. لازم تطابق SECTION_KEYS بـ admin.html */
  trust:    ['#marquee'],
  services: ['#services'],
  about:    ['#about'],
  reviews:  ['#reviews'],
  plans:    ['#plans'],
  classes:  ['#classes'],
  faq:      ['#faq'],
  cta:      ['#contact']
};

function navItems(){
  const items = [
    ['services','#services'],['about','#about'],['plans','#plans'],['classes','#classes'],['faq','#faq'],['contact','#contact']
  ].filter(([k]) => k === 'classes' ? hasClasses() : sec(k === 'contact' ? 'cta' : k))

  if (page('courses')) items.push({ k:'courses', href:'catalog.html#/courses', txt:L('nav.courses'), ext:true });
  return items;
}

function photoInto(el, src, pos){
  el.textContent = '';
  if (src){
    const img = new Image();
    img.alt = ''; img.decoding = 'async'; img.src = src;
    if (pos) img.style.objectPosition = pos;
    img.onerror = () => { el.innerHTML = `<div class="ph-empty">${esc(SITE.initial || 'ز')}</div>` };
    el.appendChild(img);
  } else {
    el.innerHTML = `<div class="ph-empty">${esc(SITE.initial || 'ز')}</div>`;
  }
}

/* صور بطاقة البداية — وحدة أو أكثر. أكثر من وحدة = سلايد كل ٥ ثواني */
let SL_I = 0, slTimer = null;
function heroSlides(urls){
  const el = $('#introPhoto'), bars = $('#slBars');
  clearInterval(slTimer); SL_I = 0;
  if (urls.length < 2){ bars.innerHTML = ''; return photoInto(el, urls[0]) }
  el.innerHTML = urls.map((u, i) => `<div class="sl${i === 0 ? ' on' : ''}"><img src="${esc(u)}" alt="" decoding="async"${i ? ' loading="lazy"' : ''}></div>`).join('');
  bars.innerHTML = urls.map((_, i) => `<button type="button" data-sl="${i}" aria-label="${i + 1}"${i === 0 ? ' class="on"' : ''}><i></i></button>`).join('');
  const show = i => {
    SL_I = (i + urls.length) % urls.length;
    el.querySelectorAll('.sl').forEach((s, k) => s.classList.toggle('on', k === SL_I));
    bars.querySelectorAll('button').forEach((b, k) => {
      b.classList.remove('on'); b.classList.toggle('done', k < SL_I);
      if (k === SL_I){ void b.offsetWidth; b.classList.add('on') }    /* يعيد حركة الشريط */
    });
  };
  const run = () => { clearInterval(slTimer); if (!RM.matches) slTimer = setInterval(() => { if (!document.hidden) show(SL_I + 1) }, 5000) };
  bars.onclick = e => { const b = e.target.closest('[data-sl]'); if (b){ show(+b.dataset.sl); run() } };
  run();
}

/* العنوان الكبير: كل كلمة بغلاف حتى تطلع وحدة وحدة */
function paintTitle(){
  const h = $('#introTitle');
  h.innerHTML = titleHtml(L('intro.title'));
  let i = 0;
  const wrapText = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3){
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return }
          const w = document.createElement('span'); w.className = 'w';
          const inner = document.createElement('span'); inner.textContent = part; inner.style.setProperty('--i', i++);
          w.appendChild(inner); frag.appendChild(w);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1) wrapText(n);
    });
  };
  wrapText(h);
  h.setAttribute('aria-label', h.textContent.replace(/\s+/g, ' ').trim());
}

/* النجمة — ١٦ رأس، تنرسم مرة وحدة */
function paintBurst(){
  const pts = [], n = 16;
  for (let i = 0; i < n * 2; i++){
    const r = i % 2 ? 41 : 50, a = (Math.PI * i) / n;
    pts.push((50 + r * Math.sin(a)).toFixed(2) + ',' + (50 - r * Math.cos(a)).toFixed(2));
  }
  $('#burstSvg').innerHTML = `<polygon points="${pts.join(' ')}"/>`;
}

/* المبلغ الفعلي بالدينار — حقل amount (رقم) إذا موجود، وإلا من نص السعر.
   ⚠️ هذا للعرض بس. السيرفر (دالة الدفع) يعيد الحساب من الداتابيس بنفسه
   وما يصدّق أي مبلغ يجي من المتصفح. */
function planAmount(p){
  if (Number.isFinite(+p.amount) && +p.amount > 0) return Math.round(+p.amount);
  const digits = latin(bi(p.price)).replace(/[^\d]/g, '');
  return digits ? +digits : 0;
}

/* ── وجه وظهر البطاقة ── */
const flipBtn = () => `<button class="flip-btn" type="button" data-flip>${ico('i-rotate')}<span>${esc(L('plans.details'))}</span></button>`;
const backHead = name => `<div class="back-head"><b>${esc(name)}</b>
  <button class="ibtn" type="button" data-unflip aria-label="${esc(L('plans.back'))}" title="${esc(L('plans.back'))}">${ico('i-rotate')}</button></div>`;
const featList = feats => `<ul>${feats.map(f => `<li>${ico('i-check')}<span>${esc(f)}</span></li>`).join('')}</ul>`;

/* البطاقة من فوك لجوة: الاسم ← الوعد ← الفوائد ← «تناسبك إذا» ← السعر آخر شي.
   السعر القديم (was) يبين مشطوب، والتوفير ينحسب وحده من الفرق. */
const numOf = v => +latin(bi(v)).replace(/[^\d]/g, '') || 0;
const fmtNum = n => n.toLocaleString('en-US');
function planPrice(p, cls){
  const was = numOf(p.was), save = was - planAmount(p);
  return `<div class="pbox${cls ? ' ' + cls : ''}">
      ${was && save > 0 ? `<div class="was"><s>${esc(bi(p.was))}</s><span class="save">${esc(L('plans.save').split('{n}').join(fmtNum(save)))}</span></div>` : ''}
      <div class="price"><b>${esc(bi(p.price))}</b><span>${esc(bi(p.unit))}</span></div>
      ${bi(p.priceNote) ? `<p class="pnote">${esc(bi(p.priceNote))}</p>` : ''}
    </div>`;
}

/* ══════════════════════════════════════════════════════════
   الشريط الدوّار (coverflow) — نفسه للباقات والكلاسات
   • البطاقة الفعّالة بالنص، وجارتين من كل جهة مايلات لورا
   • يدور وحده كل ٦ ثواني، ويوقف إذا المؤشر عليه أو بطاقة مقلوبة
     أو الشريط مو بالشاشة أو «تقليل الحركة» شغّال
   • سحب بالإصبع، أسهم، نقاط، وأسهم الكيبورد
   ══════════════════════════════════════════════════════════ */
const CF = {};
function coverflow(root, cards, prev){
  if (prev) prev.destroy();
  const n = cards.length;
  root.innerHTML = '';
  if (!n) return null;
  const rtl = () => document.documentElement.dir === 'rtl';
  root.setAttribute('role', 'region');
  root.setAttribute('aria-roledescription', 'carousel');
  root.innerHTML = `<div class="cf-stage">${cards.map((c, i) => `
    <article class="cf-card${c.feat ? ' feat' : ''}" role="group" aria-roledescription="slide" aria-label="${esc(c.label)} — ${i + 1} / ${n}" data-i="${i}">
      <div class="flip">
        <div class="face front${c.cls ? ' cls' : ''}">${c.front}</div>
        <div class="face back" inert>${c.back}</div>
      </div>
    </article>`).join('')}</div>
    ${n > 1 ? `<div class="cf-nav">
      <button class="cf-arrow prev" type="button" aria-label="${LANG === 'ar' ? 'السابق' : 'Previous'}">${ico('i-arrow')}</button>
      <div class="dots cf-dots" role="group">${cards.map((c, i) => `<button type="button" data-dot="${i}" aria-label="${esc(c.label)}"></button>`).join('')}</div>
      <button class="cf-arrow next" type="button" aria-label="${LANG === 'ar' ? 'التالي' : 'Next'}">${ico('i-arrow')}</button>
    </div>` : ''}`;
  const stage = root.querySelector('.cf-stage');
  const els = [...root.querySelectorAll('.cf-card')];
  /* البداية على المميزة إذا موجودة */
  let cur = Math.max(0, cards.findIndex(c => c.feat));
  let timer = null, hover = false, seen = false, focusIn = false;

  const setFlip = (el, on) => {
    el.classList.toggle('flipped', on);
    const on2 = el.classList.contains('on');
    el.querySelector('.front').inert = !on2 || on;
    el.querySelector('.back').inert  = !on2 || !on;
    if (!on) el._hoverFlip = false;
  };

  function layout(){
    const w = els[0].offsetWidth || 340;
    const small = innerWidth < 700;
    const sp = w * (small ? .74 : .68), dir = rtl() ? -1 : 1;
    els.forEach((el, i) => {
      let d = ((i - cur) % n + n) % n;
      if (d > n / 2) d -= n;
      const a = Math.abs(d);
      const x = dir * d * sp;
      const rot = a ? -Math.sign(x) * (small ? 22 : 30) : 0;
      el.style.transform = `translate3d(${x.toFixed(1)}px,0,${-a * (small ? 110 : 150)}px) rotateY(${rot}deg) scale(${(1 - a * .05).toFixed(3)})`;
      el.style.zIndex = String(20 - a);
      el.classList.toggle('on', a === 0);
      el.classList.toggle('far', a > 2);
      el.setAttribute('aria-hidden', String(a !== 0));
      if (a !== 0 && el.classList.contains('flipped')) setFlip(el, false);
      else setFlip(el, el.classList.contains('flipped'));
    });
    root.querySelectorAll('[data-dot]').forEach((b, i) => {
      if (i === cur) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
  }
  const go = i => { cur = ((i % n) + n) % n; layout() };

  const anyFlipped = () => els.some(el => el.classList.contains('flipped'));
  function tick(){
    clearInterval(timer);
    if (RM.matches || n < 2) return;
    timer = setInterval(() => {
      if (document.hidden || hover || focusIn || !seen || anyFlipped()) return;
      go(cur + 1);
    }, 6000);
  }

  /* الضغط: بطاقة جانبية = تصير بالنص؛ أزرار القلب؛ الأسهم والنقاط */
  let dragX = null, dragged = false;
  /* البطاقة تنقلب بس بزر «التفاصيل» — لا بالمرور ولا باللمس على وجهها */
  const onClick = e => {
    if (dragged){ dragged = false; return }
    const card = e.target.closest('.cf-card');
    if (e.target.closest('.prev')) return go(cur - 1), tick();
    if (e.target.closest('.next')) return go(cur + 1), tick();
    const dot = e.target.closest('[data-dot]'); if (dot) return go(+dot.dataset.dot), tick();
    if (!card) return;
    if (!card.classList.contains('on')){ e.preventDefault(); go(+card.dataset.i); tick(); return }
    if (e.target.closest('[data-flip]')){ setFlip(card, true); card._pinned = true; card.querySelector('[data-unflip]')?.focus({ preventScroll:true }); return }
    if (e.target.closest('[data-unflip]')){ card._pinned = false; card._noHover = true; setFlip(card, false); card.querySelector('[data-flip]')?.focus({ preventScroll:true }); return }
  };
  const onDown = e => { if (e.pointerType !== 'mouse' || e.button === 0){ dragX = e.clientX; dragged = false } };
  const onUp = e => {
    if (dragX == null) return;
    const dx = e.clientX - dragX; dragX = null;
    if (Math.abs(dx) < 45) return;
    dragged = true; setTimeout(() => { dragged = false }, 0);
    const fwd = rtl() ? dx > 0 : dx < 0;
    go(cur + (fwd ? 1 : -1)); tick();
  };
  const onKey = e => {
    if (e.target.closest('input,textarea')) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const fwd = (e.key === 'ArrowLeft') === rtl();
    e.preventDefault(); go(cur + (fwd ? 1 : -1)); tick();
    requestAnimationFrame(() => els[cur].querySelector('.front button')?.focus({ preventScroll:true }));
  };

  root.addEventListener('click', onClick);
  stage.addEventListener('pointerdown', onDown);
  stage.addEventListener('pointerup', onUp);
  stage.addEventListener('pointercancel', () => { dragX = null });
  root.addEventListener('keydown', onKey);
  const hIn = () => { hover = true }, hOut = () => { hover = false };
  root.addEventListener('pointerenter', hIn); root.addEventListener('pointerleave', hOut);
  const fIn = () => { focusIn = true }, fOut = e => { if (!root.contains(e.relatedTarget)) focusIn = false };
  root.addEventListener('focusin', fIn); root.addEventListener('focusout', fOut);
  addEventListener('resize', layout, { passive:true });
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { seen = es[0].isIntersecting }, { threshold:.35 }) : null;
  if (io) io.observe(root); else seen = true;

  layout(); tick();
  return {
    go,
    destroy(){
      clearInterval(timer); io?.disconnect();
      removeEventListener('resize', layout);
      root.removeEventListener('click', onClick); root.removeEventListener('keydown', onKey);
      root.removeEventListener('pointerenter', hIn); root.removeEventListener('pointerleave', hOut);

/* ══════════════════════════════════════════════════════════
   الحركة
   ══════════════════════════════════════════════════════════ */
let RV_IO = null;
function wireReveal(){
  RV_IO?.disconnect();
  if (RM.matches || !('IntersectionObserver' in window)){ $$('[data-rv]').forEach(el => el.classList.add('in')); return }
  RV_IO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('in'); RV_IO.unobserve(e.target) }
  }), { rootMargin:'0px 0px -10% 0px', threshold:.12 });
  $$('[data-rv]:not(.in)').forEach(el => RV_IO.observe(el));
}

/* الأرقام تعدّ من الصفر — تحافظ على البادئة واللاحقة (+120 · 4.9★) */
let COUNT_IO = null;
function countUp(){
  COUNT_IO?.disconnect();
  const els = $$('[data-count]');
  if (RM.matches || !('IntersectionObserver' in window)) return;
  const run = el => {
    const txt = el.dataset.count, m = txt.match(/^(\D*)(\d+(?:[.,]\d+)*)(.*)$/);
    if (!m) return;
    const raw = m[2].replace(/,/g, ''), target = parseFloat(raw), dec = (raw.split('.')[1] || '').length;
    const t0 = performance.now(), dur = 1600;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      const v = (target * e).toFixed(dec);
      el.textContent = m[1] + (m[2].includes(',') ? Number(v).toLocaleString('en-US') : v) + m[3];
      if (p < 1) requestAnimationFrame(step); else el.textContent = txt;
    };
    requestAnimationFrame(step);
  };
  COUNT_IO = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ run(e.target); COUNT_IO.unobserve(e.target) }
  }), { threshold:.6 });
  els.forEach(el => COUNT_IO.observe(el));
}

/* ميلان بطاقات الباقات وية الماوس */
function wireTilt(){
  if (RM.matches || !FINE.matches) return;
  $$('[data-tilt]').forEach(card => {
    const base = card.classList.contains('feat') && innerWidth >= 860 ? 'translateY(-14px) ' : '';
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `${base}rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 9).toFixed(2)}deg)`;
    });
    card.addEventListener('pointerleave', () => { card.style.transform = '' });
  });
}

/* أزرار تنجذب للمؤشر */
function wireMagnetic(){
  if (RM.matches || !FINE.matches) return;
  $$('[data-mag]').forEach(b => {
    if (b._mag) return; b._mag = true;
    b.addEventListener('pointermove', e => {
      const r = b.getBoundingClientRect();
      b.style.transform = `translate(${((e.clientX - r.left - r.width / 2) * .18).toFixed(1)}px,${((e.clientY - r.top - r.height / 2) * .28).toFixed(1)}px)`;
    });
    b.addEventListener('pointerleave', () => { b.style.transform = '' });
  });
}

/* التمرير: شريط التقدم · الهيدر · عمق الصور · الرابط الفعّال */
let ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    $('#progress').style.transform = `scaleX(${h > 0 ? (y / h).toFixed(4) : 0})`;
    $('#nav').classList.toggle('stuck', y > 8);
    if (!RM.matches){
      $$('[data-par]').forEach(el => {
        const r = el.parentElement.getBoundingClientRect();
        if (r.bottom < 0 || r.top > innerHeight) return;
        const c = r.top + r.height / 2 - innerHeight / 2;
        el.style.transform = `translate3d(0,${(c * +el.dataset.par).toFixed(1)}px,0)`;
      });
    }
    let cur = '';
    for (const k of ['services','about','reviews','plans','classes','faq','contact']){
      const el = document.getElementById(k);
      if (el && !el.classList.contains('sec-hidden') && el.getBoundingClientRect().top < innerHeight * .4) cur = k;
    }
    $$('#links a').forEach(a => a.classList.toggle('on', a.dataset.k === cur));
  });
}

/* توهج بطاقة البداية يلحق المؤشر */
function wireGlow(){
  if (RM.matches || !FINE.matches) return;
  const c = $('#introCard');

  });
}

  const star = f => f.req ? ' <span class="req">*</span>' : '';
  const one = f => {
    if (f.train && !train) return '';
    const v = FDATA[f.k];
    const id = 'f_' + f.k;
    if (f.type === 'consent')
      return `<div class="fld"><label class="opt"><input type="checkbox" name="consent"${v ? ' checked' : ''}><span>${esc(L('form.consent'))} <span class="req">*</span></span></label>
        <p class="fp-note">${esc(L('form.note'))}</p></div>`;
    if (f.type === 'select')
      return `<div class="fld"><label for="${id}">${lab(f.label)}${star(f)}</label><select id="${id}" name="${f.k}">
        <option value="">—</option>${f.opts.map(o => `<option value="${esc(o.ar)}"${v === o.ar ? ' selected' : ''}>${lab(o)}</option>`).join('')}</select></div>`;
    if (f.type === 'radio' || f.type === 'checks' || f.type === 'yn'){
      const multi = f.type === 'checks', opts = f.type === 'yn' ? YN : f.opts;
      const val = f.type === 'yn' ? (v && v.a) : v;
      const on = o => multi ? (Array.isArray(v) && v.includes(o.ar)) : val === o.ar;
      return `<div class="fld" role="group" aria-labelledby="${id}"><span class="lbl" id="${id}">${lab(f.label)}${star(f)}</span>
        <div class="opts${f.col ? ' col' : ''}${f.type === 'yn' || f.gender ? ' yn' : ''}">${opts.map(o =>
          `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="${f.k}" value="${esc(o.ar)}"${on(o) ? ' checked' : ''}><span>${lab(o)}</span></label>`).join('')}</div>
        ${f.type === 'yn' ? `<textarea class="sub-q" name="${f.k}_d" placeholder="${lab(f.hint)}"${val === 'نعم' ? '' : ' hidden'}>${esc(v && v.d || '')}</textarea>` : ''}

  FORM[FSTEP].f.flatMap(x => x.row || [x]).forEach(f => {
    const els = [...fm.querySelectorAll(`[name="${f.k}"]`)];
    if (!els.length) return;
    if (f.type === 'checks') FDATA[f.k] = els.filter(e => e.checked).map(e => e.value);
    else if (f.type === 'consent') FDATA[f.k] = els[0].checked;
    else if (f.type === 'radio') FDATA[f.k] = (els.find(e => e.checked) || {}).value || '';
    else if (f.type === 'yn'){
      const a = (els.find(e => e.checked) || {}).value || '';
      const d = (fm.querySelector(`[name="${f.k}_d"]`) || {}).value || '';
      FDATA[f.k] = { a, d:a === 'نعم' ? d.trim().slice(0, 800) : '' };
    }
    else FDATA[f.k] = String(els[0].value || '').trim();
  });
}
function stepError(){
  const train = !/^برنامج غذائي$/.test(FDATA.service || '');
  for (const f of FORM[FSTEP].f.flatMap(x => x.row || [x])){
    if (f.train && !train) continue;
    const v = FDATA[f.k];
    if (f.req){
      const empty = f.type === 'checks' ? !(v && v.length) : f.type === 'yn' ? !(v && v.a) : f.type === 'consent' ? !v : !String(v ?? '').trim();
      if (empty) return [f.k, L('form.need')];
    }
    if (f.type === 'yn' && v && v.a === 'نعم' && !v.d) return [f.k + '_d', L('form.need')];
    if (f.type === 'num' && v !== '' && v != null){
      const n = +latin(v);
      if (!(n >= f.min && n <= f.max)) return [f.k, `${bi(f.label)}: ${f.min}–${f.max}`];
    }
    if (f.k === 'name' && String(v).length < 2) return [f.k, L('pay.needName')];
    if (f.k === 'phone' && !/^\+?\d{10,15}$/.test(latin(v).replace(/[^\d+]/g, ''))) return [f.k, L('pay.needPhone')];
  }
  return null;
}

/* الأجوبة كنص: سطر لكل سؤال — للواتساب وللوحة */
function formLines(){
  const train = !/^برنامج غذائي$/.test(FDATA.service || '');
  return formFields().filter(f => f.type !== 'consent' && !(f.train && !train)).map(f => {
    let v = FDATA[f.k];
    const disp = x => { const o = (f.opts || []).find(o => o.ar === x); return o ? gx(o).ar : x };
    if (f.type === 'checks') v = (v || []).map(disp).join('، ');
    else if (f.type === 'radio') v = disp(v);
    else if (f.type === 'yn') v = v && v.a ? v.a + (v.d ? ' — ' + v.d : '') : '';
    return [f.short || f.label.ar, String(v ?? '').trim()];
  }).filter(([, v]) => v);
}

async function submitForm(){
  const p = list('plans')[FPLAN] || {};
  const num = k => { const n = parseFloat(latin(FDATA[k])); return Number.isFinite(n) ? n : null };
  const phone = latin(FDATA.phone).replace(/[^\d+]/g, '');
  const core = ['name','phone','age','sex','weight','height','service','goals'];
  const answers = Object.fromEntries(formLines().filter(([q]) => !core.some(k => (f => f.short || f.label.ar)(formFields().find(f => f.k === k)) === q)));
  const row = {
    plan_index:FPLAN, plan_name:bi(p.name).trim().slice(0, 200), name:FDATA.name.slice(0, 80), phone,
    age:num('age') == null ? null : Math.round(num('age')), sex:FDATA.sex || '', weight:num('weight'), height:num('height'),
    service:FDATA.service || '', goals:FDATA.goals || [], answers, consent:true, lang:LANG
  };
  const btn = $('#formNext'); btn.disabled = true; $('#formNext span').textContent = L('form.wait');
  let ok = false;
  try { const { error } = await sb.from('assessments').insert(row); ok = !error }
  catch(e){}
  btn.disabled = false;

  /* رسالة الواتساب: السطر الأول من اللوحة + كل الأجوبة */
  const head = L('form.wa').split('{name}').join(row.name).split('{plan}').join(row.plan_name);
  const body = formLines().map(([q, a]) => `• ${q}: ${a}`).join('\n');
  const wa = waLink(head + '\n\n' + body);
  $('#formWa').href = wa; $('#formWa').hidden = wa === '#';
  $('#formSaveErr').hidden = ok;
  $('#formPay').hidden = !page('pay');
  $('#asForm').hidden = true; $('#formDone').hidden = false;
}

function wireForm(){
  const fm = $('#asForm');
  fm.addEventListener('change', e => {
    const t = e.target;
    /* «نعم» تفتح مربع التفاصيل */
    if (t.type === 'radio'){
      const d = fm.querySelector(`[name="${t.name}_d"]`);
      if (d){ d.hidden = t.value !== 'نعم'; if (!d.hidden) d.focus() }
    }
    $('#formErr').textContent = '';
  });
  fm.addEventListener('submit', e => {
    e.preventDefault();
    readStep();
    const bad = stepError();
    if (bad){
      $('#formErr').textContent = bad[1];
      const el = fm.querySelector(`[name="${bad[0]}"]`);
      el && el.focus && el.focus();
      return;
    }
    if (FSTEP < FORM.length - 1){ FSTEP++; drawForm(); fm.querySelector('input,select,textarea')?.focus({ preventScroll:true }); return }
    submitForm();
  });
  $('#formPrev').addEventListener('click', () => { readStep(); if (FSTEP > 0){ FSTEP--; drawForm() } });
  /* الدفع بعد الاستمارة: الاسم والرقم يتعبّون تلقائياً */
  $('#formPay').addEventListener('click', () => {
    $('#formDlg').close();
    openPay(FPLAN);
    $('#payName').value = FDATA.name || '';
    $('#payPhone').value = FDATA.phone || '';
  });
}

/* فيديوهات الكلاسات — تنفتح بنافذة بصوت */
function wireVideos(){
  const dlg = $('#vidDlg'), v = $('#vidPlayer');
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-vid]'); if (!b) return;
    if (b.closest('.cf-card:not(.on)')) return;    /* بطاقة جانبية: الضغطة تنقلها للنص بس */
    e.stopPropagation();
    const u = b.dataset.vid; if (!/^https:\/\//i.test(u)) return;
    v.src = u; $('#vidCap').textContent = b.dataset.cap || '';
    dlg.showModal();
    v.play().catch(() => {});
  }, true);
  dlg.addEventListener('close', () => { v.pause(); v.removeAttribute('src'); v.load() });
}

/* حجز كلاس: رسالة واتساب جاهزة باسم الكلاس */
function openClass(i){
  const c = classList()[i]; if (!c) return;
  const href = waLink(L('classes.wa').split('{class}').join(bi(c.name)));
  if (href !== '#') open(href, '_blank', 'noopener');
  else location.hash = '#contact';
}

async function submitPay(e){
  e.preventDefault();
  const name = $('#payName').value.trim();
  const phone = latin($('#payPhone').value).replace(/[^\d+]/g, '');
  const err = $('#payErr');
  if (name.length < 2){ err.textContent = L('pay.needName'); $('#payName').focus(); return }
  if (!/^\+?\d{10,15}$/.test(phone)){ err.textContent = L('pay.needPhone'); $('#payPhone').focus(); return }
  err.textContent = '';
  const btn = $('#paySubmit'), lbl = btn.querySelector('span');
  btn.disabled = true; lbl.textContent = L('pay.wait');
  try {
    const back = location.origin + location.pathname;
    const { data, error } = await sb.functions.invoke(PAY_FN, {
      body:{ plan:PAY_PLAN, name, phone, lang:LANG, back }
    });
    if (error || !data || !/^https:\/\//i.test(data.url || '')) throw error || new Error('no url');
    location.href = data.url;
  } catch(ex){
    btn.disabled = false; lbl.textContent = L('pay.submit');
    const p = list('plans')[PAY_PLAN];
    const wa = waLink(L('pay.wa').split('{plan}').join(p ? bi(p.name) : ''));
    err.innerHTML = esc(L('pay.err')) + (wa !== '#' ? ` <a href="${esc(wa)}" target="_blank" rel="noopener" style="text-decoration:underline">WhatsApp</a>` : '');
  }
}

/* الرجوع من Wayl: ?pay=back&order=<id>&k=<مفتاح الطلب>
   الحالة تجي من السيرفر (اللي يسأل Wayl بنفسه) — مو من الرابط. أي أحد
   يكدر يكتب ?pay=… بالرابط، فما نعرض «تم الدفع» إلا إذا السيرفر قالها. */
function showResult(kind){
  const map = { ok:['i-check','pay.okT','pay.okS'], fail:['i-close','pay.failT','pay.failS'], pend:['i-clock','pay.pendT','pay.pendS'] }[kind];
  $('#resBox').classList.toggle('bad', kind === 'fail');
  $('#resIco').innerHTML = ico(map[0]);
  $('#resTitle').textContent = L(map[1]);
  $('#resText').textContent  = L(map[2]);
  if (!$('#resDlg').open) $('#resDlg').showModal();
}
async function payReturn(){
  const q = new URLSearchParams(location.search);
  if (q.get('pay') !== 'back') return;
  const order = q.get('order') || '', key = q.get('k') || '';
  ['pay','order','k'].forEach(k => q.delete(k));
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
  showResult('pend');
  /* Wayl ممكن يتأخر ثواني بتأكيد الدفع — نسأل كم مرة قبل ما نستسلم */
  for (let i = 0; i < 4; i++){
    try {
      const { data } = await sb.functions.invoke(PAY_FN, { body:{ action:'status', order, key } });
      if (data && data.status === 'paid')  return showResult('ok');
      if (data && data.status === 'failed') return showResult('fail');
    } catch(e){}
    await new Promise(r => setTimeout(r, 2500));
  }
}

/* ══════════════════════════════════════════════════════════
   الثيم واللغة
   ══════════════════════════════════════════════════════════ */
function currentTheme(){
  const t = document.documentElement.dataset.theme;
  if (t === 'dark' || t === 'light') return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme(){
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  const apply = () => {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('cz-theme', next) } catch(e){}
  };
  if (document.startViewTransition && !RM.matches) document.startViewTransition(apply); else apply();
}
function toggleLang(){
  LANG = LANG === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('cz-lang', LANG) } catch(e){}
  REV_I = 0;
  const run = () => { paint(); $('#intro').classList.add('go') };
  if (document.startViewTransition && !RM.matches) document.startViewTransition(run); else run();
}

/* ══════════════════════════════════════════════════════════
   الإقلاع
   ══════════════════════════════════════════════════════════ */
function wire(){
  addEventListener('scroll', onScroll, { passive:true });
  addEventListener('resize', onScroll, { passive:true });
  $('#themeBtn').addEventListener('click', toggleTheme);
  $('#langBtn').addEventListener('click', toggleLang);

  const menu = $('#menu'), mb = $('#menuBtn');
  const setMenu = open => { menu.classList.toggle('open', open); mb.setAttribute('aria-expanded', String(open)) };
  mb.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
  menu.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false) });
  document.addEventListener('click', e => { if (!e.target.closest('#menu,#menuBtn')) setMenu(false) });
  addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false) });

  /* الأسئلة — وحدة مفتوحة بالمرة */
  $('#faqList').addEventListener('click', e => {
    const b = e.target.closest('.qa button'); if (!b) return;
    const qa = b.parentElement, open = !qa.hasAttribute('data-open');
    $$('.qa[data-open]').forEach(x => { x.removeAttribute('data-open'); x.querySelector('button').setAttribute('aria-expanded','false') });
    if (open){ qa.setAttribute('data-open', ''); b.setAttribute('aria-expanded', 'true') }
  });

  /* الآراء — نقاط + سحب بالإصبع */
  $('#revDots').addEventListener('click', e => {
    const b = e.target.closest('[data-rev]'); if (!b) return;
    showReview(+b.dataset.rev); startReviews();
  });
  let sx = null;
  $('#revStage').addEventListener('pointerdown', e => { sx = e.clientX });
  $('#revStage').addEventListener('pointerup', e => {
    if (sx == null) return;
    const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) < 40) return;
    const fwd = (dx < 0) === (LANG === 'en');
    showReview(REV_I + (fwd ? 1 : -1)); startReviews();
  });
  $('#reviews').addEventListener('pointerenter', () => clearInterval(revTimer));
  $('#reviews').addEventListener('pointerleave', startReviews);

  $('#planCf').addEventListener('click', e => {
    const b = e.target.closest('.cf-card.on [data-plan]'); if (b) openPlan(+b.dataset.plan);
  });
  $('#classCf').addEventListener('click', e => {
    const b = e.target.closest('.cf-card.on [data-class]'); if (b) openClass(+b.dataset.class);
  });
  $('#payForm').addEventListener('submit', submitPay);
  wireForm();
  wireVideos();
  $('#payForm').addEventListener('input', () => { $('#payErr').textContent = '' });
  $$('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
  $$('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close() }));

  wireGlow();
}

async function boot(){
  paintBurst();
  wire();
  /* البيانات بحد أقصى ٢٫٥ ثانية — بعدها نرسم بالنص الافتراضي ونكمل */
  const timeout = new Promise(r => setTimeout(() => r({ timeout:true }), 2500));
  const res = await Promise.race([
    Promise.resolve(sb.from('site_info').select('*').eq('id', 1).maybeSingle()).catch(e => ({ error:e })),
    timeout
  ]);
  if (res && res.data) SITE = res.data;
  paint();
  $('#boot').classList.add('gone');
  requestAnimationFrame(() => $('#intro').classList.add('go'));
  payReturn();
  /* إذا البيانات تأخرت، نرسم مرة ثانية أول ما توصل */
  if (res && res.timeout){
    const late = await Promise.resolve(sb.from('site_info').select('*').eq('id', 1).maybeSingle()).catch(() => null);
    if (late && late.data){ SITE = late.data; paint() }
  }
}
boot();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
